.dot{fill:#2ee6c5;opacity:0;animation:pop .4s 3.6s forwards,pulse 2s 4s infinite}
@keyframes pop{to{opacity:1}}
@keyframes pulse{50%{opacity:.35}}
.t1{opacity:0;animation:fade 1s .3s forwards}
.t2{opacity:0;animation:fade 1s .9s forwards}
.t3{opacity:0;animation:fade 1s 1.5s forwards}
@keyframes fade{to{opacity:1}}
</style>
